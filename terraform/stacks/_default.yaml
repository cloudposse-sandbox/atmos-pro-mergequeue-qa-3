vars:
  namespace: cplive
  tenant: plat
  region: us-east-2
  environment: ue2
  github_repo_name: atmos-native-ci

terraform:
  # Configure context
  vars:
    label_order:
      - namespace
      - tenant
      - environment
      - stage
      - name
      - attributes
    descriptor_formats:
      account_name:
        format: "%v-%v"
        labels:
          - tenant
          - stage
      stack:
        format: "%v-%v-%v"
        labels:
          - tenant
          - environment
          - stage

  backend_type: s3
  backend:
    s3:
      bucket: atmos-pro-qa3-tfstate
      dynamodb_table: atmos-pro-qa3-tfstate
      role_arn: null
      encrypt: true
      key: terraform.tfstate
      acl: bucket-owner-full-control
      region: us-east-2
  remote_state_backend:
    s3:
      role_arn: null

  dependencies:
    tools:
      # Use a specific terraform version from toolchain
      opentofu: "1.6.0"
